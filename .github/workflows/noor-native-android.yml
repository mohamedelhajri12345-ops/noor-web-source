name: NOOR Native Android (V2)

on:
  push:
    branches:
      - main
    paths:
      - 'native/**'
      - '.github/workflows/noor-native-android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: noor-native-android
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate Expo project
        run: npx expo-doctor

      - name: Generate native Android project
        run: npx expo prebuild --platform android --clean --no-install --non-interactive

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace --warning-mode all

      - name: Verify APK exists
        run: test -f android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: noor-native-debug-apk
          path: native/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
